<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Ponto | Secretaria Municipal de Saúde</title>
  <meta name="description" content="Sistema de controle, fechamento e aprovação de ponto da Secretaria Municipal de Saúde." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css?v=20260921-v13" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="loginView" class="login-shell">
    <div class="login-visual" aria-hidden="true">
      <div class="login-visual__top"> 
      </div>
      <div class="login-visual__footer">
        <strong>Prefeitura Municipal</strong>
        <span>Acesso restrito a servidores autorizados</span>
      </div>

      <div class="login-watermark" aria-hidden="true">SMS</div>
    </div>

    <div class="login-panel">
      <div class="login-panel-inner">
        <div class="login-card">
          <div class="mobile-brand">
            <div class="brand-mark">SMS</div>
            <div>
              <strong>Secretaria Municipal de Saúde</strong>
              <span>Controle de Ponto</span>
            </div>
          </div>

          <div class="login-heading">
            <span class="eyebrow">SECRETARIA MUNICIPAL DE SAÚDE</span>
            <h2>Acesse sua conta</h2>
            <p class="muted">Entre com suas credenciais para acessar o Controle de Ponto.</p>
          </div>

          <form id="loginForm" novalidate>
            <label class="field login-field">
              <span>E-mail</span>
              <div class="input-with-icon">
                <span class="field-icon" aria-hidden="true">○</span>
                <input id="loginEmail" type="email" placeholder="seu.usuario@saude.gov.br" required autocomplete="username" />
              </div>
            </label>

            <label class="field login-field">
              <span>Senha</span>
              <div class="password-wrap input-with-icon">
                <span class="field-icon lock-icon" aria-hidden="true">□</span>
                <input id="loginPassword" type="password" placeholder="Digite sua senha" required autocomplete="current-password" />
                <button type="button" class="icon-button" id="togglePassword" aria-label="Mostrar senha">◉</button>
              </div>
            </label>

            <div class="login-options">
              <label class="remember-access">
                <input type="checkbox" id="rememberAccess" />
                <span>Lembrar meu acesso</span>
              </label>
              <a class="support-text" href="#" id="forgotPasswordLink">Esqueceu a senha?</a>
            </div>

            <button class="btn btn--primary btn--block login-submit" type="submit">
              <span>→</span>
              ACESSAR SISTEMA
            </button>
          </form>

        </div>
      </div>
    </div>
  </section>

  <section id="appView" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand brand--official">
        <div class="brand-logo-shell brand-logo-shell--sidebar">
          <img
    class="brand-logo brand-logo--sidebar"
    src="/static/assets/sms_logo_dark.png"
    alt="Prefeitura de Três Lagoas - Secretaria Municipal de Saúde"
/>
        </div>
      </div>

      <nav id="mainNav" class="nav"></nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="avatar" id="sidebarAvatar">VF</div>
          <div>
            <strong id="sidebarUser">Usuário</strong>
            <span id="sidebarRole">Perfil</span>
          </div>
        </div>
        <button id="logoutBtn" class="btn btn--ghost btn--block">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" aria-label="Abrir menu">☰</button>
        <div>
          <span class="breadcrumb" id="breadcrumb">Início</span>
          <h2 id="pageTitle">Painel</h2>
        </div>
        <div class="topbar-actions">
          <div class="notif-wrap" id="notifWrap">
            <button class="icon-button notification" id="notifBtn" title="Notificações" aria-haspopup="true" aria-expanded="false">♢<span id="notifBadge" class="hidden">0</span></button>
            <div class="notif-panel hidden" id="notifPanel">
              <div class="notif-panel__head">
                <strong>Notificações</strong>
                <button type="button" id="notifMarkAllBtn" class="notif-panel__mark-all">Marcar tudo como lido</button>
              </div>
              <div class="notif-panel__list" id="notifList"></div>
            </div>
          </div>
          <div class="avatar" id="topAvatar">VF</div>
        </div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </section>

  <div id="modalRoot"></div>

  <script src="static/auth_manager.js"></script>

  <script src="static/app.js?v=20260921-v13"></script>
</body>
</html>
